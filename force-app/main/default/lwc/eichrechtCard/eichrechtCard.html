<template>
    <article class="ec-card">

        <header class="ec-header">
            <svg class="ec-icon ec-icon_lg" style={statusStyle} viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path fill="currentColor" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
            </svg>
            <div class="ec-header-text">
                <span class="ec-title">Eichrecht</span>
                <span class="ec-subtitle">{stichtagText}</span>
            </div>
        </header>

        <template if:true={laedt}>
            <div class="ec-empty">Wird geladen …</div>
        </template>

        <template if:true={fehler}>
            <div class="ec-empty ec-empty_fehler">{fehler}</div>
        </template>

        <template if:true={daten}>

            <section class="ec-status" style={statusRandStyle}>
                <div class="ec-status-zeile">
                    <span class="ec-punkt" style={statusStyle}>&#9679;</span>
                    <span class="ec-status-text" style={statusStyle}>{daten.statusText}</span>
                </div>
                <p class="ec-begruendung">{daten.begruendung}</p>
            </section>

            <template if:true={zeigtFristen}>
                <dl class="ec-fristen">
                    <div class="ec-frist">
                        <dt>Fristbeginn</dt>
                        <dd>{fristbeginnText}</dd>
                    </div>
                    <div class="ec-frist">
                        <dt>Fristende</dt>
                        <dd>{fristendeText}</dd>
                    </div>
                    <div class="ec-frist">
                        <dt>Restlaufzeit</dt>
                        <dd style={statusStyle}>{restlaufzeitText}</dd>
                    </div>
                </dl>
            </template>

            <template if:true={hatRechtsgrundlagen}>
                <section class="ec-abschnitt">
                    <h3 class="ec-abschnitt-titel">Rechtsgrundlagen</h3>
                    <p class="ec-abschnitt-hinweis">
                        Nur die Vorschriften, die für diesen Ladepunkt tatsächlich gegriffen haben.
                    </p>
                    <ul class="ec-normen">
                        <template for:each={normen} for:item="n">
                            <li key={n.schluessel} class="ec-norm">
                                <button class="ec-norm-kopf" data-schluessel={n.schluessel} onclick={toggleNorm}>
                                    <span class="ec-norm-pfeil">{n.pfeil}</span>
                                    <span class="ec-norm-zitat">{n.norm}</span>
                                    <template if:true={n.aufgehoben}>
                                        <span class="ec-badge ec-badge_aufgehoben">aufgehoben</span>
                                    </template>
                                </button>
                                <template if:true={n.offen}>
                                    <div class="ec-norm-inhalt">
                                        <template if:true={n.wortlaut}>
                                            <blockquote class="ec-wortlaut">{n.wortlaut}</blockquote>
                                        </template>
                                        <template if:true={n.hinweis}>
                                            <p class="ec-hinweis">{n.hinweis}</p>
                                        </template>
                                        <template if:true={n.url}>
                                            <a class="ec-quelle" href={n.url} target="_blank" rel="noopener noreferrer">
                                                Amtlicher Text ansehen
                                            </a>
                                        </template>
                                    </div>
                                </template>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>

            <section class="ec-abschnitt">
                <h3 class="ec-abschnitt-titel">Verlauf</h3>
                <template if:true={hatVerlauf}>
                    <ul class="ec-verlauf">
                        <template for:each={verlauf} for:item="v">
                            <li key={v.id} class="ec-ereignis">
                                <span class="ec-ereignis-punkt" style={v.punktStyle}>&#9679;</span>
                                <div class="ec-ereignis-inhalt">
                                    <div class="ec-ereignis-kopf">
                                        <span class="ec-ereignis-datum">{v.datumText}</span>
                                        <span class="ec-ereignis-typ">{v.typ}</span>
                                    </div>
                                    <p class="ec-ereignis-wirkung">{v.wirkung}</p>
                                    <template if:true={v.beschreibung}>
                                        <p class="ec-ereignis-text">{v.beschreibung}</p>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:false={hatVerlauf}>
                    <p class="ec-empty">Keine Eingriffe, Instandsetzungen oder Nacheichungen erfasst.</p>
                </template>
            </section>

        </template>
    </article>
</template>
